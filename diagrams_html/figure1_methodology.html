<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #ffffff; padding: 30px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  
  .rup-container {
    width: 1550px;
    height: 980px;
    background: #ffffff;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    padding: 30px 40px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    position: relative;
  }

  .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #22c55e; padding-bottom: 12px; margin-bottom: 24px; }
  .header h1 { font-size: 26px; font-weight: 700; color: #0f172a; letter-spacing: 0.5px; }
  .header .brand { font-size: 16px; font-weight: 700; color: #64748b; }

  svg { width: 100%; height: 800px; }

  /* Phase Header Bars */
  .phase-header-bg { fill: #1e293b; }
  .phase-text { font-size: 15px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; text-transform: uppercase; letter-spacing: 0.5px; }
  .iter-text { font-size: 12.5px; font-weight: 700; fill: #334155; text-anchor: middle; dominant-baseline: middle; }

  /* Grid Lines */
  .grid-v { stroke: #334155; stroke-width: 1.5; }
  .grid-h { stroke: #cbd5e1; stroke-width: 1.2; }
  .grid-phase-sep { stroke: #0f172a; stroke-width: 2.2; }

  /* Discipline Labels */
  .discipline-text { font-size: 13.5px; font-weight: 700; fill: #1e293b; text-anchor: end; dominant-baseline: middle; }

  /* Humps Styling */
  .hump-business { fill: #dc2626; stroke: #991b1b; stroke-width: 1.5; }
  .hump-requirements { fill: #ea580c; stroke: #9a3412; stroke-width: 1.5; }
  .hump-design { fill: #f59e0b; stroke: #b45309; stroke-width: 1.5; }
  .hump-implementation { fill: #eab308; stroke: #a16207; stroke-width: 1.5; }
  .hump-test { fill: #16a34a; stroke: #15803d; stroke-width: 1.5; }
  .hump-deployment { fill: #2563eb; stroke: #1d4ed8; stroke-width: 1.5; }

  .time-axis { stroke: #334155; stroke-width: 2; marker-end: url(#arrow-head); }
  .time-text { font-size: 13px; font-weight: 700; fill: #334155; dominant-baseline: middle; }

  .caption { text-align: center; margin-top: 14px; font-size: 14px; font-weight: 600; color: #334155; }
</style>
</head>
<body>

<div class="rup-container">
  <div class="header">
    <h1>Rational Unified Process (RUP) — Lifecycle & Disciplines</h1>
    <div class="brand">Superlines Transportation Co. Inc.</div>
  </div>

  <svg viewBox="0 0 1480 760">
    <defs>
      <marker id="arrow-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
      </marker>
    </defs>

    <!-- LEFT LABEL AREA: X: 0 to 220 -->
    <!-- CHART GRID AREA: X: 220 to 1420 (Width: 1200px) -->
    <!-- 4 Phases:
         Inception:   X: 220 to 400 (W: 180) -> Iterations: I1 (180)
         Elaboration: X: 400 to 720 (W: 320) -> Iterations: E1 (160), E2 (160)
         Construction:X: 720 to 1240 (W: 520) -> Iterations: C1 (130), C2 (130), C3 (130), C4 (130)
         Transition:  X: 1240 to 1420 (W: 180) -> Iterations: T1 (90), T2 (90)
    -->

    <!-- TOP PHASE HEADERS (Y: 20 to 60) -->
    <!-- Inception -->
    <rect x="220" y="20" width="180" height="40" class="phase-header-bg" />
    <text x="310" y="40" class="phase-text">Inception</text>

    <!-- Elaboration -->
    <rect x="400" y="20" width="320" height="40" class="phase-header-bg" style="fill: #1e293b;" />
    <text x="560" y="40" class="phase-text">Elaboration</text>

    <!-- Construction -->
    <rect x="720" y="20" width="520" height="40" class="phase-header-bg" style="fill: #0f172a;" />
    <text x="980" y="40" class="phase-text">Construction</text>

    <!-- Transition -->
    <rect x="1240" y="20" width="180" height="40" class="phase-header-bg" style="fill: #1e293b;" />
    <text x="1330" y="40" class="phase-text">Transition</text>

    <!-- ITERATION SUB-ROW (Y: 60 to 95) -->
    <rect x="220" y="60" width="1200" height="35" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <text x="310" y="78" class="iter-text">I1 (Daet Study)</text>
    <text x="480" y="78" class="iter-text">E1 (Architecture)</text>
    <text x="640" y="78" class="iter-text">E2 (DFD/ERD)</text>
    <text x="785" y="78" class="iter-text">C1 (Sprint 1)</text>
    <text x="915" y="78" class="iter-text">C2 (Sprint 2)</text>
    <text x="1045" y="78" class="iter-text">C3 (Sprint 3)</text>
    <text x="1175" y="78" class="iter-text">C4 (Sprint 4)</text>
    <text x="1285" y="78" class="iter-text">T1 (Deploy)</text>
    <text x="1375" y="78" class="iter-text">T2 (Defense)</text>

    <!-- HORIZONTAL GRID LANES (6 Disciplines, Y: 95 to 635, 90px each) -->
    <!-- Row 1: Business Modeling (Y: 95 to 185) -->
    <rect x="220" y="95" width="1200" height="90" fill="#ffffff" />
    <line x1="220" y1="185" x2="1420" y2="185" class="grid-h" />
    <text x="205" y="140" class="discipline-text">Business Modeling</text>

    <!-- Row 2: Requirements (Y: 185 to 275) -->
    <rect x="220" y="185" width="1200" height="90" fill="#fafafa" />
    <line x1="220" y1="275" x2="1420" y2="275" class="grid-h" />
    <text x="205" y="230" class="discipline-text">Requirements</text>

    <!-- Row 3: Analysis & Design (Y: 275 to 365) -->
    <rect x="220" y="275" width="1200" height="90" fill="#ffffff" />
    <line x1="220" y1="365" x2="1420" y2="365" class="grid-h" />
    <text x="205" y="320" class="discipline-text">Analysis & Design</text>

    <!-- Row 4: Implementation (Y: 365 to 455) -->
    <rect x="220" y="365" width="1200" height="90" fill="#fafafa" />
    <line x1="220" y1="455" x2="1420" y2="455" class="grid-h" />
    <text x="205" y="410" class="discipline-text">Implementation</text>

    <!-- Row 5: Test (Y: 455 to 545) -->
    <rect x="220" y="455" width="1200" height="90" fill="#ffffff" />
    <line x1="220" y1="545" x2="1420" y2="545" class="grid-h" />
    <text x="205" y="500" class="discipline-text">Test</text>

    <!-- Row 6: Deployment (Y: 545 to 635) -->
    <rect x="220" y="545" width="1200" height="90" fill="#fafafa" />
    <line x1="220" y1="635" x2="1420" y2="635" class="grid-h" />
    <text x="205" y="590" class="discipline-text">Deployment</text>


    <!-- ================================================================= -->
    <!-- RUP HUMPS (WORKLOAD DISTRIBUTION POLYGONS) -->
    <!-- ================================================================= -->

    <!-- 1. BUSINESS MODELING HUMP (Row 1, Base Y: 185) -->
    <!-- Peaks in Inception & Early Elaboration, then flattens -->
    <path d="M 230 185 
             C 260 185, 280 120, 320 120 
             L 520 120 
             C 580 120, 620 160, 720 165 
             L 1100 170 
             C 1250 175, 1350 182, 1410 185 
             Z" class="hump-business" />

    <!-- 2. REQUIREMENTS HUMP (Row 2, Base Y: 275) -->
    <!-- Starts high in Inception, peaks in Elaboration, tapers in Construction -->
    <path d="M 225 255 
             C 270 250, 340 210, 420 205 
             L 580 205 
             C 660 205, 700 245, 780 250 
             L 1200 258 
             C 1300 262, 1380 273, 1410 275 
             Z" class="hump-requirements" />

    <!-- 3. ANALYSIS & DESIGN HUMP (Row 3, Base Y: 365) -->
    <!-- Starts in late Inception, major peak in Elaboration, tapers across Construction -->
    <path d="M 350 365 
             C 380 360, 410 290, 480 290 
             L 660 290 
             C 740 290, 800 330, 920 335 
             L 1220 350 
             C 1280 355, 1340 365, 1360 365 
             Z" class="hump-design" />

    <!-- 4. IMPLEMENTATION HUMP (Row 4, Base Y: 455) -->
    <!-- Starts small in Elaboration, massive plateau across Construction (Sprints 1-4), tapers in Transition -->
    <path d="M 360 455 
             C 420 450, 500 410, 580 405 
             L 1000 405 
             C 1120 405, 1180 430, 1280 440 
             L 1380 455 
             Z" class="hump-implementation" />

    <!-- 5. TEST HUMP (Row 5, Base Y: 545) -->
    <!-- Multiple hump peaks: Elaboration POC, Sprint testing in Construction, and UAT in Transition -->
    <!-- Peak 1: Elaboration testing (X: 580 to 720) -->
    <path d="M 370 545 
             C 420 545, 500 520, 580 500 
             C 640 480, 680 510, 750 545 
             Z" class="hump-test" />
    
    <!-- Peak 2: Construction iterative sprint testing (X: 780 to 1050) -->
    <path d="M 770 545 
             C 820 540, 870 500, 930 500 
             C 990 500, 1020 535, 1080 545 
             Z" class="hump-test" />

    <!-- Peak 3: Transition UAT testing (X: 1100 to 1400) -->
    <path d="M 1100 545 
             C 1150 540, 1220 490, 1290 490 
             C 1340 490, 1380 535, 1410 545 
             Z" class="hump-test" />

    <!-- 6. DEPLOYMENT HUMP (Row 6, Base Y: 635) -->
    <!-- Begins in late Construction, major peak during Transition (UAT, Server setup, Final defense) -->
    <path d="M 720 635 
             C 850 635, 960 615, 1100 600 
             L 1250 575 
             C 1320 575, 1370 610, 1410 635 
             Z" class="hump-deployment" />


    <!-- ================================================================= -->
    <!-- VERTICAL GRID LINES (Drawn over humps for clean phase separation) -->
    <!-- ================================================================= -->
    <!-- Inception to Elaboration -->
    <line x1="400" y1="60" x2="400" y2="635" class="grid-phase-sep" />
    <!-- Elaboration to Construction -->
    <line x1="720" y1="60" x2="720" y2="635" class="grid-phase-sep" />
    <!-- Construction to Transition -->
    <line x1="1240" y1="60" x2="1240" y2="635" class="grid-phase-sep" />

    <!-- Iteration dividers -->
    <line x1="560" y1="60" x2="560" y2="635" class="grid-v" stroke-dasharray="4,3" />
    <line x1="850" y1="60" x2="850" y2="635" class="grid-v" stroke-dasharray="4,3" />
    <line x1="980" y1="60" x2="980" y2="635" class="grid-v" stroke-dasharray="4,3" />
    <line x1="1110" y1="60" x2="1110" y2="635" class="grid-v" stroke-dasharray="4,3" />
    <line x1="1330" y1="60" x2="1330" y2="635" class="grid-v" stroke-dasharray="4,3" />

    <!-- Outer Box Border -->
    <rect x="220" y="20" width="1200" height="615" fill="none" stroke="#0f172a" stroke-width="2.5" />

    <!-- TIME AXIS ARROW -->
    <line x1="220" y1="675" x2="1420" y2="675" class="time-axis" />
    <text x="220" y="700" class="time-text">Time / Iterations</text>
    <text x="1350" y="700" class="time-text" text-anchor="end">Production Release ➔</text>
  </svg>

  <div class="caption">
    Figure 1. Rational Unified Process (RUP) Dynamic Lifecycle and Discipline Workload Matrix
  </div>
</div>

</body>
</html>
